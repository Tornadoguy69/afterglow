<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Expanding Universe — Afterglow</title>
<link rel="icon" type="image/svg+xml" href="../../engine/logo.svg">

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<div id="app">
  <header>
    <div class="brand">
      <a class="back" href="../../index.html">← All topics</a>
      <h1>The Expanding Universe</h1>
      <span class="tier tier-established">Established</span>
      <span class="sub">every galaxy sees itself at the centre</span>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="gl"></canvas>
      <div id="inspector">
        <div class="bar" id="insBar">
          <span class="grip">⠿</span><span id="insTitle">Hubble diagram from the chosen galaxy</span>
          <span class="sp"></span>
          <button class="ib" id="insReset" title="Snap back">⤢</button>
          <button class="ib" id="insMin" title="Collapse">▾</button>
        </div>
        <canvas id="inset"></canvas>
      </div>
      <div id="caption"></div>
    </div>
    <div id="divider"></div>
    <aside id="panel"></aside>
  </main>
</div>

<script type="module">
import { THREE, boot, ui, Plot, PAL, el, fmt, sci, starTexture } from '../../engine/engine.js';
import { tour } from '../../engine/tour.js';

/* ═══════════════════════════════════════════════════════════════════════════
   COSMOLOGY.  Flat ΛCDM has a closed-form scale factor:
       a(t) = (Ω_m/Ω_Λ)^{1/3} · sinh^{2/3}( (3/2)·√Ω_Λ·H₀t )
   and therefore an exact age. Everything else here follows from it.
   ═══════════════════════════════════════════════════════════════════════════ */
const OM=0.315, OL=0.685;
const C_KMS=299792.458;
const H0_PLANCK=67.4, H0_SHOES=73.0;          // the tension, ~5σ apart
const GYR_PER_INV_H = 977.79;                 // 1/(km/s/Mpc) in Gyr

let H0 = H0_PLANCK;
const hubbleTimeGyr = () => GYR_PER_INV_H/H0;
const ageAt = a => (2/(3*Math.sqrt(OL)))*Math.asinh(Math.sqrt(OL/OM)*Math.pow(a,1.5))*hubbleTimeGyr();
const age0  = () => ageAt(1);
/* H(a) = H₀ √(Ω_m a⁻³ + Ω_Λ) */
const Hofa  = a => H0*Math.sqrt(OM/(a*a*a)+OL);
const zOfA  = a => 1/a - 1;
const hubbleRadiusGly = () => C_KMS/H0 * 3.2616e-3;   // Mpc → Gly

/* ═══════════════════════════════════════════════════════════════════════════
   SCENE — a comoving lattice of galaxies. Physical position = a(t) × comoving,
   which is the entire content of "space expands".
   ═══════════════════════════════════════════════════════════════════════════ */
const app = boot({
  cameraPos:new THREE.Vector3(0,90,190), target:new THREE.Vector3(0,0,0),
  dist:[30,1600], near:0.5, far:9000, exposure:0.82,
  bloom:{strength:0.30, radius:0.5, threshold:0.5}
});
const {scene}=app;

const N=13;                                   // 13³ = 2197 galaxies
const SPACING=15;
const comoving=[];
{
  let seed=99;
  const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff;};
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) for(let k=0;k<N;k++){
    comoving.push(new THREE.Vector3(
      (i-(N-1)/2)*SPACING + (rnd()-0.5)*SPACING*0.55,
      (j-(N-1)/2)*SPACING + (rnd()-0.5)*SPACING*0.55,
      (k-(N-1)/2)*SPACING + (rnd()-0.5)*SPACING*0.55));
  }
}
const NG=comoving.length;
const gPos=new Float32Array(NG*3), gCol=new Float32Array(NG*3);
const gGeo=new THREE.BufferGeometry();
gGeo.setAttribute('position',new THREE.BufferAttribute(gPos,3));
gGeo.setAttribute('color',new THREE.BufferAttribute(gCol,3));
scene.add(new THREE.Points(gGeo,new THREE.PointsMaterial({
  size:3.1,map:starTexture(false),vertexColors:true,transparent:true,opacity:0.95,
  depthWrite:false,blending:THREE.AdditiveBlending})));

/* the galaxy we are pretending to live in */
const meGeo=new THREE.BufferGeometry();
meGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(3),3));
scene.add(new THREE.Points(meGeo,new THREE.PointsMaterial({
  size:11,map:starTexture(true),color:0x6BA8FF,transparent:true,opacity:1,
  depthWrite:false,blending:THREE.AdditiveBlending})));

/* ═══════════════════════════════════════════════════════════════════════════
   PANEL
   ═══════════════════════════════════════════════════════════════════════════ */
const P={a:1.0, obs:Math.floor(NG/2), play:false, tension:false};

const sA=ui.slider({label:'Scale factor  a', min:0.15, max:2.2, step:0.005, value:1,
  fmt:v=>v.toFixed(3), on:v=>{P.a=v; P.play=false; playBtn.textContent='▶  Run time forward'; update();}});
const playBtn=ui.button('▶  Run time forward',()=>{
  P.play=!P.play; playBtn.textContent=P.play?'❚❚  Pause':'▶  Run time forward';
});

const panel=el('div');
panel.appendChild(ui.section('Hubble\'s law',
  ui.eq('v = H₀ · d   <span class="c">recession speed grows with distance</span>'),
  ui.eq('a(t) = (Ω_m/Ω_Λ)^⅓ · sinh^⅔( 3/2 √Ω_Λ H₀t )'),
  ui.note('Galaxies are not flying through space. <b>The distances between them are growing.</b> '+
          'Every galaxy sits still in its own comoving coordinates while the grid stretches.')));

panel.appendChild(ui.section('Time', sA.node, ui.btnRow(playBtn,
  ui.button('Now (a = 1)',()=>{P.a=1;sA.set(1);P.play=false;playBtn.textContent='▶  Run time forward';update();}))));

panel.appendChild(ui.section('Where are you standing?',
  ui.btnRow(
    ui.button('Centre galaxy',()=>{P.obs=Math.floor(NG/2); update();}),
    ui.button('Random galaxy',()=>{P.obs=Math.floor(Math.random()*NG); update();}),
    ui.button('Far edge',()=>{P.obs=NG-1; update();})),
  ui.note('<b>This is the part worth playing with.</b> Move yourself anywhere in the lattice. '+
          'The Hubble diagram is identical from every single one. There is no centre — not '+
          'because we cannot find it, but because every point is equally the centre.')));

const tog=ui.toggle({label:'Use the SH0ES value instead (73.0)', value:false, on:v=>{
  P.tension=v; H0 = v? H0_SHOES : H0_PLANCK; update();}});
panel.appendChild(ui.section('Hubble constant', tog.node, ui.note(
  'The early universe (Planck, from the CMB) says <b>67.4 ± 0.5</b>. The local distance ladder '+
  '(SH0ES, from Cepheids and supernovae) says <b>73.0 ± 1.0</b>. They disagree by about 5σ. '+
  'Nobody knows why. Watch the age of the universe change when you switch.')));

const ro=ui.readout([
  {id:'a',   k:'scale factor'},
  {id:'z',   k:'redshift of light emitted now', tip:'z = 1/a − 1. Light leaving now arrives stretched by this much.'},
  {id:'age', k:'age of the universe'},
  {id:'H',   k:'expansion rate H(a)', tip:'Not constant. It was much faster early on and is now slowly rising again as dark energy takes over.'},
  {id:'HR',  k:'Hubble radius', tip:'Where recession speed reaches c. Not a horizon — we can and do see galaxies beyond it.'},
  {id:'sup', k:'galaxies receding faster than light', cls:'hi',
   tip:'Perfectly allowed. Nothing is moving through space faster than light; the space between is growing.'},
  {id:'obs', k:'observer', },
  {id:'slope',k:'measured H from this galaxy', cls:'big',
   tip:'Fitted from the plotted points. Identical wherever you stand.'}
]);
panel.appendChild(ui.section('Readout', ro.node));

panel.appendChild(ui.section('Sources', ui.ref(
  '<b>Hubble\'s law:</b> Hubble 1929, PNAS 15, 168 · '+
  '<b>Accelerating expansion:</b> Riess et al. 1998, AJ 116, 1009; Perlmutter et al. 1999, ApJ 517, 565 · '+
  '<b>H₀ = 67.4:</b> Planck Collaboration VI 2020, A&amp;A 641, A6 · '+
  '<b>H₀ = 73.0:</b> Riess et al. 2022, ApJL 934, L7 · '+
  '<b>Superluminal recession:</b> Davis &amp; Lineweaver 2004, PASA 21, 97')));
app.setPanel(panel);

/* ═══════════════════════════════════════════════════════════════════════════ */
/* 1 scene unit = 45 Mpc, chosen so the lattice reaches past the Hubble radius
   (c/H₀ ≈ 4450 Mpc). At a smaller scale nothing ever recedes faster than light and
   the most counter-intuitive fact on the page never shows up. */
const UNIT_MPC = 45;
let fitted=0, superluminal=0, plotPts=[];

function update(){
  const a=P.a;
  const origin=comoving[P.obs];
  const H=Hofa(a);

  plotPts=[]; superluminal=0;
  let sxy=0, sxx=0;
  const col=new THREE.Color();

  for(let i=0;i<NG;i++){
    const cx=comoving[i].x-origin.x, cy=comoving[i].y-origin.y, cz=comoving[i].z-origin.z;
    // physical position, recentred on the chosen observer
    const px=cx*a, py=cy*a, pz=cz*a;
    gPos[i*3]=px; gPos[i*3+1]=py; gPos[i*3+2]=pz;

    const dMpc=Math.sqrt(px*px+py*py+pz*pz)*UNIT_MPC;
    const v=H*dMpc;                                   // v = H d, exactly
    if(v>C_KMS) superluminal++;
    if(i%7===0 && dMpc>0.5) plotPts.push([dMpc, v]);
    sxy+=dMpc*v; sxx+=dMpc*dMpc;

    // redshift tint: further = redder
    const t=Math.min(1, v/C_KMS);
    col.setRGB(1, 0.93-0.45*t, 0.86-0.66*t);
    gCol[i*3]=col.r; gCol[i*3+1]=col.g; gCol[i*3+2]=col.b;
  }
  gGeo.attributes.position.needsUpdate=true;
  gGeo.attributes.color.needsUpdate=true;
  fitted = sxx>0 ? sxy/sxx : 0;                       // least-squares slope through the origin

  ro.set('a', fmt(a,3));
  ro.set('z', a>=1 ? '—' : fmt(zOfA(a),3));
  ro.set('age', fmt(ageAt(a),2)+' Gyr');
  ro.set('H', fmt(H,1)+' km/s/Mpc');
  ro.set('HR', fmt(hubbleRadiusGly()*(H0/H),2)+' Gly');
  ro.set('sup', fmt(100*superluminal/NG,1)+' % of them');
  ro.set('obs', '#'+P.obs+' of '+NG);
  ro.set('slope', fmt(fitted,1)+' km/s/Mpc');

  app.setCaption(
    `You are the blue galaxy. Every other one is moving away from you, faster the further it is — `+
    `and <b>the same is true from every galaxy in the picture</b>. `+
    `Fitted expansion rate from here: ${fmt(fitted,1)} km/s/Mpc. Move yourself and refit; it does not change. `+
    `<span class="cite">Hubble 1929, PNAS 15, 168.</span>`);

  drawPlot();
}

function drawPlot(){
  const dmax=Math.max(...plotPts.map(p=>p[0]),1)*1.05;
  const vmax=Math.max(...plotPts.map(p=>p[1]),1)*1.05;
  const p=Plot({xmin:0,xmax:dmax,ymin:0,ymax:vmax,
    xfmt:v=>Math.round(v), yfmt:v=>v>=1e4? sci(v,1) : Math.round(v)});
  const xt=[0,1,2,3,4].map(k=>Math.round(dmax*k/4));
  const yt=[0,1,2,3].map(k=>Math.round(vmax*k/3));
  p.frame('HUBBLE DIAGRAM','distance  [Mpc]','recession velocity  [km/s]',xt,yt);

  p.pts(plotPts, PAL.ink3, 1.8);
  p.line([[0,0],[dmax,fitted*dmax]], PAL.clay, 2.2);
  if(C_KMS<vmax){
    p.hline(C_KMS, PAL.rust, [5,3]);
    p.label('speed of light', p.x0+8, p.ty(C_KMS)-6, PAL.rust);
  }
  p.label('slope = H = '+fmt(fitted,1)+' km/s/Mpc', p.x0+8, p.y1+16, PAL.clay);
  p.label('perfectly straight from any galaxy you choose', p.x0+8, p.y0-9, PAL.ink3);
}

app.onFrame(dt=>{
  if(P.play){
    P.a=Math.min(2.2, P.a+dt*0.09);
    if(P.a>=2.2){ P.a=0.15; }
    sA.set(P.a); update();
  }
});
app.onThemeChange(update);   // repaint the plot when the theme flips
update();

/* ═══════════════════════════════════════════════════════════════════════════
   GUIDED TOUR
   The beats drive the same controls the visitor has. Nothing here is a special
   presentation path — it moves the real sliders, so anything the tour shows can
   be reproduced by hand afterwards.
   ═══════════════════════════════════════════════════════════════════════════ */
const setA    = v => { P.a=v; sA.set(v); update(); };
const setPlay = v => { P.play=v; playBtn.textContent = v?'❚❚  Pause':'▶  Run time forward'; };
const setObs  = i => { P.obs=i; update(); };
const setH0   = shoes => { P.tension=shoes; tog.set(shoes); H0 = shoes?H0_SHOES:H0_PLANCK; update(); };

tour(app, {beats:[
{ say:'Every galaxy in this box is sitting perfectly still. Nothing here is flying anywhere. '+
      'Watch what happens to them anyway.',
  hold:8, cam:{pos:[0,90,190], target:[0,0,0], ms:1800},
  run(){ setPlay(false); setA(1); setObs(Math.floor(NG/2)); setH0(false); } },

{ say:'You are the bright blue one in the middle. Let time run forward.',
  hold:6,
  run(){ setPlay(true); } },

{ say:'Every single galaxy is moving away from you, and the further one is, the faster it goes. '+
      'That is not an explosion pushing things outward. The galaxies are not moving. '+
      'The distance between them is growing.',
  hold:12 },

{ say:'Look at the chart. Distance along the bottom, speed up the side, and the points fall on '+
      'a straight line. Hubble measured that line in nineteen twenty nine, and its slope is the '+
      'expansion rate of the universe.',
  hold:13, cam:{pos:[0,60,150], target:[0,0,0], ms:2600} },

{ say:'Here is the part that trips almost everyone up. If everything is running away from us, '+
      'surely we are at the centre of it. So let me move you.',
  hold:10,
  run(){ setPlay(false); },
  at:[{t:6.5, do(){ setObs(NG-1); }}] },

{ say:'You are now a galaxy at the far corner of the box, thousands of millions of light years '+
      'from where you were. And the chart is identical. Same straight line, same slope.',
  hold:11, cam:{pos:[0,110,230], target:[0,0,0], ms:2400} },

{ say:'Try another one at random. And another. It never changes. '+
      'Every galaxy sees itself at the centre, which is the same as saying there is no centre at all.',
  hold:11,
  run(){ setObs(Math.floor(NG*0.31)); },
  at:[{t:4.0, do(){ setObs(Math.floor(NG*0.72)); }},
      {t:7.5, do(){ setObs(Math.floor(NG*0.08)); }}] },

{ say:'Now wind the clock backwards instead. The scale factor is the size of the universe '+
      'compared to today, and I am taking it down to a fifth.',
  hold:10,
  run(){ setObs(Math.floor(NG/2)); },
  at:[{t:4.2, do(){ setA(0.20); }}] },

{ say:'Everything is packed five times closer together. Light leaving a galaxy at this moment '+
      'arrives at us stretched out by a factor of five. That stretching is redshift, and it is '+
      'how we know how far back we are looking.',
  hold:13 },

{ say:'Back to today. Notice the readout that says some galaxies are receding faster than light. '+
      'That is allowed. Nothing is travelling through space faster than light. '+
      'There is simply more space appearing between us than light can cross.',
  hold:14, cam:{pos:[0,140,420], target:[0,0,0], ms:3000},
  run(){ setA(1); } },

{ say:'One last thing, and it is an open problem. The expansion rate measured from the early '+
      'universe is sixty seven point four. Measured from nearby stars and supernovae, it is '+
      'seventy three. Both teams are careful. Watch the age of the universe when I switch.',
  hold:15,
  at:[{t:11.5, do(){ setH0(true); }}] },

{ say:'The universe just got about a billion years younger, and nobody knows which number is '+
      'wrong. That disagreement is called the Hubble tension, and it is one of the biggest '+
      'unsolved problems in cosmology right now. The controls are yours.',
  hold:14 }
]});
</script>
